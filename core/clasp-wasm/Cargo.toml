[package]
name = "clasp-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper exposing clasp-core to JavaScript."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clasp-core = { path = "../clasp-core" }
wasm-bindgen = "0.2"
# `js` feature routes randomness to the Web Crypto API in the browser.
getrandom = { version = "0.2", features = ["js"] }
# `OsRng` (RngCore + CryptoRng) for OPRF blinding, backed by getrandom above.
rand_core = { version = "0.6", features = ["getrandom"] }
