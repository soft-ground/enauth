[package]
name = "clasp-core"
version = "0.1.0"
edition = "2021"
description = "CLASP crypto core: Basalt KDF, key derivation, and VOPRF primitives."
license = "UNLICENSED"

# NOTE: dependency versions are provisional; pin exact versions and review
# licenses before first release (see docs/implementation-design.md §8).
# Dependencies are added per-module as each is implemented, so the tree stays
# minimal and each addition is verified by a build:
#   - basalt: argon2
#   - keys:   ed25519-dalek
#   - oprf:   voprf (RFC 9497 VOPRF over ristretto255), subtle, rand_core
[dependencies]
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
