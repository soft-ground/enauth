name: Dependency audit

# Kept separate from CI so a newly published advisory cannot break unrelated
# pull requests. Runs weekly, on demand, and when a lockfile changes.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - pnpm-lock.yaml
  pull_request:
    paths:
      - Cargo.lock
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

  pnpm-audit:
    name: pnpm audit (npm advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Audit JS dependencies
        run: pnpm audit
